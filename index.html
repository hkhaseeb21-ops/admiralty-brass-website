<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock demo - Admiralty Brass Co.</title>
<style>
  body{font-family:Arial,sans-serif;margin:24px;background:#faf8f3;color:#222}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;position:relative}
  .card.soldout{opacity:.6}
  .price{font-size:1.1rem;margin:8px 0}
  .tag{position:absolute;top:10px;right:10px;background:#b00020;color:#fff;font-size:.7rem;padding:3px 8px;border-radius:12px}
  .tag.low{background:#b7791f}
  .btn{background:#1f3a5f;color:#fff;border:0;padding:10px 14px;border-radius:6px;cursor:pointer;width:100%}
  .btn-soldout{background:#999;cursor:not-allowed}
</style>
</head>
<body>
<h1>Admiralty Brass Co.</h1>
<div class="grid" id="grid"></div>
<script src="products.js"></script>
<script src="stock.js"></script>
<script>
function addToCart(sku){ if(!canBuy(sku,1)){alert("Sorry, this item is sold out.");return;} alert("Added "+sku+" (replace with your real cart code)"); }
document.getElementById("grid").innerHTML = PRODUCTS.map(function(p){
  var s = stockStatus(p);
  var tag = s==="soldout" ? '<span class="tag">SOLD OUT</span>' : (p.stock===1 ? '<span class="tag low">LAST ONE</span>' : '');
  return '<div class="card '+(s==="soldout"?"soldout":"")+'">'+tag+
    '<h3>'+p.name+'</h3><div class="price">$'+p.price.toFixed(2)+' CAD</div>'+buyButton(p)+'</div>';
}).join("");
</script>
</body>
</html>
